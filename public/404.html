<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      // Redirect to index.html while preserving the path
      var redirectPath = window.location.pathname;
      var params = window.location.search;

      // Push original path as ?redirect=/path
      window.location.replace(
        "/?redirect=" + encodeURIComponent(redirectPath + params)
      );
    </script>
  </head>
  <body>
  </body>
</html>
